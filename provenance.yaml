# provenance.yaml — parameter provenance ledger (§9.2 integrity infrastructure)
#
# Every quantitative parameter that is [est.] or [verify] in the codebase, with:
#   value        current planning value in code (single source of truth = the .py)
#   unit         physical unit
#   status       est | verify | derived  (derived = computed from other params)
#   source       named primary source to check against, or "ASSUMPTION" if none
#   e11_weight   qualitative influence on the E11 economic headline (hi/med/lo/none)
#   note         short justification / relationship
#
# RULE (enforced by scripts/check_provenance.py): a parameter may move from
# status:est/verify to status:verified ONLY by editing this file with a real
# citation in `source` and setting `verified: true`. No manuscript number may
# cite a parameter whose verified flag is false. The [verify] register in
# verify_register.md is the human-facing worklist derived from this file.

# SOURCE TIERS (added 2026-07-13)
#   primary    read from the compiling agency's own table or publication
#   secondary  agency figure transcribed by a named outlet with a date
#   proxy      a different but documented series, with its basis difference stated
#   derived    computed from a primary series by a stated method
# A secondary or proxy value is usable and citable; it is not equivalent to
# primary and the ledger records which is which so that nothing is promoted by
# accident.

meta:
  created: 2026-07-04
  rule: "no unverified parameter enters a manuscript claim (lifecycle 9.2)"
  data_class: SYNTHETIC/physics-forward-model

parameters:

  # ---------------- product prices (enter every ΔR via value-weighted P(τ)) ----
  w_vco:
    value: 200.0; unit: PHP/kg; status: verified-derived; verified: true
    source: "DERIVED as implied export unit value from UCAP Weekly Bulletin
             Vol. LXVII No. 5, 2 February 2023, reporting October 2022 Philippine
             virgin coconut oil exports of USD 5.986 million on 1,715 MT. Unit
             value 3,490 USD/MT, which is 204 PHP/kg at approximately 58.5
             PHP/USD for the period and 214 PHP/kg at the 61.43 rate stated in
             the PCA bulletin of 31 July 2026."
    e11_weight: hi
    note: "VERIFIED BY DERIVATION, after the earlier conclusion that no public VCO
           price exists. That conclusion was right about PRICE SERIES and wrong
           about derivability: no agency quotes a VCO price, but export value
           divided by export volume yields an implied unit value, and VCO output
           is overwhelmingly exported so FOB export is arguably the correct basis
           for the plant's realised price rather than a substitute for it.
           Modelled 200.0 sits within two percent of the derived 204. The figure
           is a single month and predates the current window, so it should be
           reported as an order-of-magnitude confirmation rather than a current
           price. CITATION CONSTRAINT: the UCAP bulletin carries an explicit
           reproduction restriction; cite the two figures with attribution and do
           not reproduce its tables."
  w_crude:
    value: 140.0; unit: PHP/kg; status: verified-primary; verified: true
    source: "PCA Daily Market Prices, 31 July 2026, section III-A Domestic
             Millgate Price: CRUDE COCONUT OIL 100.8 to 125.44 PHP/kg, VAT
             inclusive, sourced by PCA from UCAP. RBD CNO cooking oil 132.72 to
             143.36 over the same day. The bulletin states the exchange rate it
             uses, US$1 = 61.43 PHP, and quotes international coconut oil CIF
             Europe at 1,990 USD/MT, consistent with the World Bank Pink Sheet
             June 2026 figure of 1,979 USD/MT."
    e11_weight: hi
    note: "VERIFIED AT PRIMARY TIER, AND THE MODELLED VALUE IS OPTIMISTIC. This is
           the first parameter found to err in the unfavourable direction:
           modelled 140.0 sits 12 to 39 percent ABOVE the observed domestic
           millgate range of 100.8 to 125.44. It corresponds instead to REFINED
           RBD oil at 132.72 to 143.36, which is a different product from the
           crude stream the bypass option sells.
           THIS ALSO OVERTURNS THE EARLIER PROXY. The World Bank CIF Rotterdam
           series converted to about 141 PHP/kg and appeared to agree with the
           modelled value to within one percent. The ledger recorded at the time
           that this agreement was a coincidence of basis and not a validation,
           because Rotterdam carries freight. The primary domestic figure now
           shows the basis gap is 15 to 40 percent, so the caution was warranted
           and the apparent agreement was spurious."
  w_meal:
    value: 22.0; unit: PHP/kg; status: verify; verified: false
    source: "copra meal / animal feed wholesale (PSA / feed millers)"
    e11_weight: med
  w_char:
    value: 32.0; unit: PHP/kg; status: verify; verified: false
    source: "charcoal / activated-carbon precursor price"
    e11_weight: lo
  w_conc:
    value: 100.0; unit: PHP/kg; status: verify; verified: false
    source: "coconut water concentrate (65 Brix) export/domestic price"
