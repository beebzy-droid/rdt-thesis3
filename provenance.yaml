             millgate 74.46, so the series has fallen sharply over twelve months."
    e11_weight: hi
    note: "VERIFIED AT PRIMARY TIER, superseding the earlier secondary reading.
           Modelled 40.0 is 17 percent BELOW the Region XI farmgate of 47.94 and
           close to the national average of 41.40. Conservative for a Davao
           siting. The twelve-month swing is large (Region XI millgate 74.46 to
