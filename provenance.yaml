    value: 40.0; unit: PHP/kg; status: verified-primary; verified: true
    source: "PCA Trade and Market Development Department, Daily Market Prices,
             31 July 2026 (primary bulletin). Domestic copra, Region XI (Davao):
             FARMGATE 47.94 PHP/kg, MILLGATE 62.58 PHP/kg. National averages the
