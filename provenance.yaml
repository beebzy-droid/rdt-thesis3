  # ---------------- episode frequencies (multiply ΔR→annual in E11) -----------
  freq_D1:
    value: 2.0; unit: episodes/yr; status: verify; verified: false
    source: "PAGASA tropical-cyclone climatology, supply-disrupting landfalls in
             sourcing region (CALABARZON/Quezon)"
    e11_weight: med
  freq_D3:
    value: 4.0; unit: episodes/yr; status: verify; verified: false
    source: "plant reliability records / agro-processing MTBF (Phase-5 interviews)"
    e11_weight: med
  freq_D4:
    value: 6.0; unit: episodes/yr; status: verified-source; verified: true
    source: "ERC 2015-2023 Reliability Indices Summary (SAIFI by cause and
             distribution utility), accessed 2026-07-13. Region XI Davao:
             DLPC (Davao Light, urban) total SAIFI mean 15.99/yr across
             2015-2023 and 9.4/yr post-2017 after a supply-driven spike;
             unplanned-only DLPC mean 13.96/yr. Rural cooperatives serving
             coconut areas run far higher: DORECO mean 41.2/yr, DANECO 50.2/yr."
    e11_weight: hi
    note: "VERIFIED. THE PLANNING VALUE OF 6/yr IS TOO LOW. The best-served urban
           utility in the region averages 9.4/yr recently; a plant sited in a
           coconut-growing area served by a cooperative faces 40-50/yr. Since
           freq_D4 carries 54% of E11, the economic result is CONSERVATIVE by
           roughly 1.6x (urban siting) to 7x (cooperative siting). Report 9.4/yr
           base case with a 6-50 band, and state the siting dependence, which is
           a finding rather than a nuisance."
  freq_D8:
    value: 1.0; unit: episodes/yr; status: verify; verified: false
    source: "joint typhoon+quality co-occurrence from PAGASA + PCA records"
    e11_weight: lo

  # ---------------- market availability (H4 φ-curve) --------------------------
  buy_cap_frac_phi:
    value: 0.3; unit: fraction-of-nominal; status: verified-derived; verified: true
    source: "DERIVED from PSA OpenSTAT Non-Food and Industrial Crops, Volume of
             Production by Region/Province/Quarter (coconut with husk), accessed
             2026-07-13. Method: first full quarter after landfall divided by the
             same quarter one year earlier, affected region. Yolanda (Nov 2013),
             Region VIII: Q1-2014 248,464 t / Q1-2013 394,538 t = 0.630. Odette
             (Dec 2021), Region XIII Caraga: 163,676 / 186,306 = 0.879. Control,
             Region XI Davao over the same events: 0.971 and 1.012."
    e11_weight: hi
    note: "VERIFIED BY DERIVATION, and the result is richer than a constant. phi
           is TRACK-DEPENDENT: 0.63 directly struck, 0.88 peripherally struck,
           ~1.0 outside the track. The modeled 0.3 is more pessimistic than any
           observed regional quarter, so the phi-sensitivity result in the
           manuscript is a genuine lower bound, not a central case. Report the
           observed envelope 0.63-1.0 with 0.3 retained as a stress case."

